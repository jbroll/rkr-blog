# The main site — readers on https://roll-along.rkroll.com, admin on
# https://rkr-blog.rkroll.com.
#
# One install, two hostnames, no redirect between them: both serve the
# same content. Only /admin is pinned to rkr-blog.rkroll.com, which keeps
# every OAuth redirect_uri on that host so the Google and Microsoft
# clients need no new registrations.
#
# APP_NAME stays `rkr-blog`: it names the systemd unit, /opt/rkr-blog,
# /var/www/rkr-blog and /etc/rkr-blog.env.
#
# Usage:
#   DEPLOY_SH_CONF=deploy/sites/rkr-blog.conf ~/src/deploy.sh/deploy.sh update .
#
# REMOTE_HOST is the VPS, not this site's public domain. Do NOT pass a
# user@host argument — it overrides REMOTE_HOST and deploys to the wrong
# machine.

source "$(dirname "${BASH_SOURCE[0]}")/../common.conf"

export APP_NAME="rkr-blog"
export DOMAIN_NAME="roll-along.rkroll.com"
export REMOTE_HOST="rkr-blog.rkroll.com"
export FASTIFY_APP_PORT="3000"

export SITE_ENV_FILE="deploy/sites/rkr-blog.env"
export FASTIFY_APP_SECRETS_FILE="deploy/secrets/rkr-blog.secrets.env"

export APACHE_SERVER_ALIASES="rkr-blog.rkroll.com"
export APACHE_CANONICAL_REDIRECT="no"
export APACHE_ADMIN_HOST="rkr-blog.rkroll.com"

export APACHE_PROXY_RULES="/:${FASTIFY_APP_PORT}:/"

# The standalone image editor (apps/image-pwa) ships with this site only,
# served at https://${DOMAIN_NAME}/image-editor/.
export DEPLOY_IMAGE_EDITOR="yes"
