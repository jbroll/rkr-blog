# Zero-override tiered gate — ALL hook logic lives in org-hooks
# (profiles/sci-tiered.yml): hygiene, secrets, format-lint, dup-types,
# no-reexports, size-caps, typecheck, knip, circular, and the tier-2 GPU
# dispatch (unit + e2e in parallel via simple-ci, fail-fast, union coverage
# ratchet). This repo carries NO local pre-commit block by design — see the
# header of sci-tiered.yml for why local overrides are unsafe to merge.
#
# Repo-specific wiring instead lives where it belongs:
#   - CI jobs:      ci/test (unit + bundle-size), ci/e2e (Playwright)
#   - npm scripts:  type-check (all tsconfigs), knip (workspace map)
#   - env knobs:    lefthook-rc.sh (ORG_HOOKS, optional DPDM_CIRCULAR, etc.)
remotes:
  - git_url: /home/john/src/org-hooks
    ref: main
    refetch: true
    configs:
      - profiles/sci-tiered.yml

rc: /home/john/src/rkr-blog/lefthook-rc.sh
