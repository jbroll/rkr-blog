# Repo-specific simple-ci settings. Host names deliberately absent.
#
# `sci` sources this file first, then ~/.config/simple-ci.conf on top,
# which wins for hosts. Naming a host here would be used on any machine
# that has no machine conf, and the bare `gpu`/`home.rkroll.com` names
# this file used to carry landed as `john` with an unrestricted shell —
# the CI-only path is the `s-ci` service user, whose key is forced to
# ci-rsync.sh.
#
# Repo-specific settings belong here. `sci push` filters the rsync through
# .gitignore, so the manifests ci/before-test-push writes must be
# force-included or the host never sees them: without ci/.changed-files the
# gate fetches no unit lcov, and without ci/.source-tree the e2e baseline is
# anchored to whatever stale copy the base worktree holds.
CI_RSYNC_ARGS="--include=ci/.changed-files --include=ci/.source-tree"
